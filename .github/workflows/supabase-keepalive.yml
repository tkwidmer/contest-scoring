name: Supabase keepalive

# Free-tier projects pause after 7 days without activity. One anonymous read every 3 days keeps it up.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one published result
        run: |
          curl --fail-with-body -sS \
            "${{ secrets.SUPABASE_URL }}/rest/v1/published_results?select=contest_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
