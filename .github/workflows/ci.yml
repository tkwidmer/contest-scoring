name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: No secret key or JWT in bundle (browser uses sb_publishable_ keys)
        run: "! grep -rE 'sb_secret_[A-Za-z0-9_-]+|eyJhbGci' dist/"

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase db start
      - run: supabase test db
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > /tmp/types.ts
          diff /tmp/types.ts src/lib/database.types.ts
